name: Deploy ATOC Editorial Copy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-copy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package JavaScript and its manifest only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/atoc-bar-v2/assets release/atoc-bar-v2/.vite
          cp dist/.vite/manifest.json release/atoc-bar-v2/.vite/manifest.json
          cp dist/assets/index-*.js release/atoc-bar-v2/assets/
          test -s release/atoc-bar-v2/.vite/manifest.json
      - name: Back up current JavaScript and manifest
        uses: appleboy/ssh-action@v1.2.0
        env:
          WP_THEME_REMOTE_PATH: ${{ secrets.WP_THEME_REMOTE_PATH }}
        with:
          host: ${{ secrets.WP_DEPLOY_HOST }}
          username: ${{ secrets.WP_DEPLOY_USER }}
          port: ${{ secrets.WP_DEPLOY_PORT }}
          password: ${{ secrets.WP_DEPLOY_PASSWORD }}
          key: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          envs: WP_THEME_REMOTE_PATH
          script: |
            set -eu
            themes_path="${WP_THEME_REMOTE_PATH%/}"
            case "$themes_path" in
              */wp-content/themes) ;;
              *) echo 'Invalid themes path'; exit 1 ;;
            esac
            theme="$themes_path/atoc-bar-v2"
            test -s "$theme/.vite/manifest.json"
            backup="$HOME/atoc-dash-backups/$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$backup"
            chmod 700 "$HOME/atoc-dash-backups" "$backup"
            cp -p "$theme/.vite/manifest.json" "$backup/manifest.json"
            cp -p "$theme"/assets/index-*.js "$backup/"
            echo "Backed up ATOC assets to $backup"
      - name: Upload JavaScript and manifest
        shell: bash
        env:
          WP_DEPLOY_HOST: ${{ secrets.WP_DEPLOY_HOST }}
          WP_DEPLOY_USER: ${{ secrets.WP_DEPLOY_USER }}
          WP_DEPLOY_PORT: ${{ secrets.WP_DEPLOY_PORT }}
          WP_DEPLOY_SSH_KEY: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          WP_THEME_REMOTE_PATH: ${{ secrets.WP_THEME_REMOTE_PATH }}
        run: |
          set -euo pipefail
          themes_path="${WP_THEME_REMOTE_PATH%/}"
          case "$themes_path" in
            */wp-content/themes) ;;
            *) echo 'Invalid themes path'; exit 1 ;;
          esac
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$WP_DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          port="${WP_DEPLOY_PORT:-22}"
          remote="${WP_DEPLOY_USER}@${WP_DEPLOY_HOST}"
          options=(-i "$key_file" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20)
          scp "${options[@]}" -P "$port" release/atoc-bar-v2/assets/index-*.js "$remote:$themes_path/atoc-bar-v2/assets/"
          scp "${options[@]}" -P "$port" release/atoc-bar-v2/.vite/manifest.json "$remote:$themes_path/atoc-bar-v2/.vite/manifest.json.editorial-new"
          ssh "${options[@]}" -p "$port" "$remote" "mv -f '$themes_path/atoc-bar-v2/.vite/manifest.json.editorial-new' '$themes_path/atoc-bar-v2/.vite/manifest.json'"
      - name: Purge page cache
        uses: appleboy/ssh-action@v1.2.0
        env:
          WP_THEME_REMOTE_PATH: ${{ secrets.WP_THEME_REMOTE_PATH }}
        with:
          host: ${{ secrets.WP_DEPLOY_HOST }}
          username: ${{ secrets.WP_DEPLOY_USER }}
          port: ${{ secrets.WP_DEPLOY_PORT }}
          password: ${{ secrets.WP_DEPLOY_PASSWORD }}
          key: ${{ secrets.WP_DEPLOY_SSH_KEY }}
          envs: WP_THEME_REMOTE_PATH
          script: |
            set -eu
            themes_path="${WP_THEME_REMOTE_PATH%/}"
            case "$themes_path" in
              */wp-content/themes) ;;
              *) echo 'Invalid themes path'; exit 1 ;;
            esac
            wordpress_root="${themes_path%/wp-content/themes}"
            cd "$wordpress_root"
            wp litespeed-purge all --allow-root
            wp cache flush --allow-root
